[project]
name = "nconpp"
version = "0.1.0"
description = "A library for tensor network calculations."
authors = [{ name = "Mirco Marahrens", email = "mirco.marahrens@googlemail.com" } ]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24.2",
]

[dependency-groups]
dev = [
    "cmake>=3.28.1,<4",
    "ninja>=1.11.1.1,<2",
    "pybind11[global]>=2.12.0,<3",
    "pre-commit>=4.0.0",
    "pre-commit-update>=0.6.1",
    "clang-format>=19.1.7",
    "clang-tidy>=19.1.0",
    "cppcheck>=1.4.7,<2",
    "cpplint>=2.0.0,<3",
    "pytest>=9.0.3",
    "poethepoet>=0.49.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "mkdoxy>=1.2.8",
    "pybind11-stubgen>=3.0.0",
]

[build-system]
requires = ["scikit-build-core>=0.2.2", "numpy>=2.0", "pybind11>=2.12.0,<3"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/nconpp"]
minimum-version = "0.2.2"
cmake.build-type = "Release"
cmake.minimum-version = "3.28"
cmake.verbose = true
ninja.make-fallback = false
ninja.minimum-version = "1.11"
logging.level = "INFO"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"

[tool.poe.tasks.test-all]
shell = "cmake --preset linux-debug && cmake --build build/linux-debug && ctest --test-dir build/linux-debug --output-on-failure && uv sync --reinstall-package nconpp && uv run pytest"
help = "Configure and build C++, run C++ ctest, reinstall nconpp wheel, and run pytest"
