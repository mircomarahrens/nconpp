[project]
name = "nconpp"
version = "0.1.0"
description = "A library for tensor network calculations."
authors = [{ name = "Mirco Marahrens", email = "mirco.marahrens@googlemail.com" } ]
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24.2",
]

[dependency-groups]
dev = [
    "cmake>=3.28.1,<4",
    "ninja>=1.11.1.1,<2",
    "pybind11[global]>=2.12.0,<3",
    "pre-commit>=3.8.0,<4",
    "pre-commit-update>=0.6.1,<0.7",
    "clang-format>=19.1.7,<20",
    "clang-tidy>=19.1.0,<20",
    "cppcheck>=1.4.7,<2",
    "cpplint>=2.0.0,<3",
    "pytest>=8.0.0",
]

[build-system]
requires = ["scikit-build-core>=0.2.2", "numpy>=2.0", "pybind11>=2.12.0,<3"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/nconpp"]
minimum-version = "0.2.2"
cmake.args = [
    "-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake",
    "-DVCPKG_OVERLAY_TRIPLETS=./triplets",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DCMAKE_C_COMPILER=/usr/bin/clang",
    "-DCMAKE_CXX_COMPILER=/usr/bin/clang++",
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DCMAKE_CXX_EXTENSIONS=OFF",
    "-DCMAKE_BUILD_TYPE=Release"
]
cmake.minimum-version = "3.26.1"
cmake.verbose = true
ninja.make-fallback = false
ninja.minimum-version = "1.11"
logging.level = "INFO"

[tool.scikit-build.cmake.define]
CMAKE_C_COMPILER = "clang"
CMAKE_CXX_COMPILER = "clang++"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
