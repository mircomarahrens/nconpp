name: CD Python

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target registry"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up xtensor-python
        run: |
          git clone --branch 0.27.0 --depth 1 --single-branch https://github.com/xtensor-stack/xtensor-python.git extern/xtensor-python

      - name: Set up vcpkg
        run: |
          git clone --branch 2025.04.09 --single-branch https://github.com/microsoft/vcpkg.git vcpkg

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-manylinux* cp311-manylinux* cp312-manylinux* cp313-manylinux* cp314-manylinux*"
          CIBW_SKIP: "*-musllinux* pp* *t-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y clang ninja-build gcc-gfortran zip unzip &&
            pipx upgrade patchelf &&
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          CIBW_ENVIRONMENT_LINUX: "CC=clang CXX=clang++ CFLAGS='-mfma' CXXFLAGS='-mfma'"
          CIBW_TEST_REQUIRES: "pytest>=8.0.0"
          CIBW_TEST_COMMAND: "pytest {project}/tests/python"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/p/nconpp' || 'https://pypi.org/p/nconpp' }}
    permissions:
      id-token: write
    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibuildwheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI / TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
          packages-dir: dist/
