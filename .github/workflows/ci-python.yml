name: CI Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CFLAGS: "-mfma"
      CXXFLAGS: "-mfma"
    strategy:
      matrix:
        python-version: ["3.12"]
        vcpkg-version: [2025.04.09]
        xtensor-python-version: [0.27.0]
        cmake-preset-target: [linux-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up vcpkg
        id: vcpkg
        run: |
          git clone --branch ${{ matrix.vcpkg-version }} --single-branch https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh --disableMetrics
          ./vcpkg integrate install
          echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_OUTPUT"
      - name: Set up xtensor-python
        run: |
          git clone --branch ${{ matrix.xtensor-python-version }} --depth 1 --single-branch https://github.com/xtensor-stack/xtensor-python.git ${{ github.workspace }}/extern/xtensor-python
      - name: Install build tools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clangd-18 gfortran make ninja-build pkg-config
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-18 100
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install the project and dependencies
        run: uv sync --all-extras --dev
      - name: Run pytest
        run: |
          uv run pytest
