name: CI C++

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CFLAGS: "-mfma"
      CXXFLAGS: "-mfma"
    strategy:
      matrix:
        python-version: ["3.12"]
        vcpkg-version: [2025.04.09]
        cmake-preset-target: [linux-debug]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up vcpkg
        id: vcpkg
        run: |
          git clone --branch ${{ matrix.vcpkg-version }} --single-branch https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh --disableMetrics
          ./vcpkg integrate install
          echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_OUTPUT"
      - name: Install build tools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clangd-18 gfortran make ninja-build pkg-config
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-18 100
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dev dependencies
        run: uv sync --all-extras --dev --no-install-project
      - name: Cmake configure
        env:
          VCPKG_ROOT: ${{ steps.vcpkg.outputs.vcpkg_root }}
        run: |
          cmake --preset ${{ matrix.cmake-preset-target }}
      - name: Cmake build
        run: |
          cmake --build ${{ github.workspace }}/build/${{ matrix.cmake-preset-target }} --parallel 10 --
      - name: Run ctest
        run: |
          ctest --test-dir build/${{ matrix.cmake-preset-target }} --output-on-failure
